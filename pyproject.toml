[project]
name = "rag-pipeline"
version = "0.1.0"
description = "RAG pipeline with FastAPI, Pinecone hybrid search, Redis caching, and LLM-as-a-Judge evaluation."
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
